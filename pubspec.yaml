name: drh_project
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2 # Ter alguns icons do cupertino por defeito
  syncfusion_flutter_datagrid: ^20.1.57 #Será para criar tabelas de visionamento de informação
  badges: ^2.0.2 #Icorporar avisos redondos como alertas no programa
  page_transition: ^2.0.5 #Meter animações e transições de tela mais fácilmente
  syncfusion_flutter_datepicker: ^20.1.57 #Biblioteca para a criação de um dataPicker
  syncfusion_flutter_sliders: ^20.1.57 #Biblioteca para a criação de um slider
  syncfusion_flutter_core: ^20.1.57 #Design todos os Widgets que envolvam syncfusion
  fluttertoast: ^8.0.9 #Aparecer mensagens como se fossem avisos
  flip_card: ^0.6.0 #Meter os cartões com animações
  intl: ^0.17.0-nullsafety.2 #Para formatar texto
  http: ^0.13.4 #Servirá para criar o token
  flutter_secure_storage: ^6.0.0 #Servirá para criar o token
  steel_crypt: ^3.0.0+1 #Criptografar cenas
  local_auth: ^2.1.0 #Autenticação por bio
  shared_preferences: ^2.0.15 #Guardar dados locais
  cached_network_image: ^3.2.1 #Para colocar limites nas imagens para não haver demasiado esforço do cpu
  flutter_spinkit: ^5.1.0 #Exporta um package de spinners de loading
  time_picker_widget: ^1.0.0+10 #Exportar um widget que retorna a hora que o utilizador queira colocar
  image_picker: ^0.8.5+3 #Captura de imagem
  pdf: ^3.8.2 #Serve para usar PDF's
  printing: ^5.9.2 #Com este package será possível partilhar documentos de uma forma mais fácil
  another_flushbar: ^1.10.29 #Diferentes tipos de snackBar
  platform_device_id: ^1.0.1 #Identificar o ID do dispositivo que está a usar a app
  carousel_slider: ^4.1.1 #Galeria de fotos
  flutter_rating_bar: ^4.0.1 #Ranking no feedback
  list_tile_switch: ^1.0.0 #Um package com vários switch buttons
  firebase_messaging: ^14.0.4 #Disponibilizar notificações
  configure: ^1.0.1 #Buscar o projeto ao firebase que estou a usar
  firebase_core: ^2.1.1 #Mais funcionaldiades
  device_info_plus: ^8.0.0 #Conseguir os dados do dispositivo a ser usado
  path_provider: ^2.0.11 #Conseguir armazenar imagens no diretório da aplicação
  flutter_cache_manager: ^3.3.0 #Limpar o cache para atualizar a fotografia quando é atualizada no projeto
  awesome_notifications: ^0.7.4+1 #Aparecer as notificações quando desejado
  file_picker: ^5.2.1 #Download de documentos
  syncfusion_flutter_pdfviewer: ^20.3.49
  path: any
  intl_translation: ^0.18.0
  provider: ^6.0.4

#Definições do ecrã splash
flutter_native_splash:
  background_image: assets/fundos/inicial.png
  image: assets/icons/logo.png
  ios: true
  android: true
  web: false

dev_dependencies:
  image: ^3.2.2
  flutter_launcher_icons: ^0.10.0 #Colocar um icon personalizado para a app no dispositivo
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher/foreground.png"
  adaptive_icon_background: "assets/launcher/background.png" 
  adaptive_icon_foreground: "assets/launcher/foreground.png" 
  remove_alpha_ios: true
  
flutter:
  generate: true #Executar o ficheiro de tradução
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/menu/
    - assets/icons/menu/passivo/
    - assets/icons/menu/ativo/
    - assets/icons/logos/
    - assets/icons/logos/logos_pb/
    - assets/icons/calendario/
    - assets/fundos/
    - assets/svgs/
        
  fonts:
    - family: DaysOne
      fonts:
        - asset: assets/fonts/DaysOne-Regular.ttf
          weight: 400
    - family: Gantari
      fonts:
        - asset: assets/fonts/Gantari-Regular.ttf
          weight: 400

linter:
  rules:
    prefer_const_constructors : false
    avoid_print : false
    prefer_const_literals_to_create_immutables: false